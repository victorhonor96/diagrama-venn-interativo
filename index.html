<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Venn Interativo</title>

  <!-- Bibliotecas -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/venn.js@0.2.20/venn.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h1>Venn Dashboard</h1>
    <p>Visualização interativa de conjuntos</p>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="header">
      <h2>Diagrama de Venn</h2>
    </div>

    <div class="grid">

      <!-- CONFIG -->
      <div class="card">
        <h3>Configuração</h3>

        <div class="input-group">
          <label>A</label>
          <input id="A" value="10">
        </div>

        <div class="input-group">
          <label>B</label>
          <input id="B" value="20">
        </div>

        <div class="input-group">
          <label>C</label>
          <input id="C" value="15">
        </div>

        <div class="input-group">
          <label>A ∩ B</label>
          <input id="AB" value="5">
        </div>

        <div class="input-group">
          <label>A ∩ C</label>
          <input id="AC" value="3">
        </div>

        <div class="input-group">
          <label>B ∩ C</label>
          <input id="BC" value="4">
        </div>

        <div class="input-group">
          <label>A ∩ B ∩ C</label>
          <input id="ABC" value="2">
        </div>

  <!-- Valores -->
  A: <input id="A" value="50">
  B: <input id="B" value="50">
  C: <input id="C" value="50"><br>

  AB: <input id="AB" value="10">
  AC: <input id="AC" value="10">
  BC: <input id="BC" value="10">
  ABC: <input id="ABC" value="5"><br>

        <button onclick="render()">Atualizar</button>
      </div>

      <!-- GRÁFICO -->
      <div class="card">
        <h3>Visualização</h3>
        <div id="venn"></div>
        <div id="info">Clique em uma região</div>
      </div>

    </div>
  </div>
</div>

<div id="venn"></div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
