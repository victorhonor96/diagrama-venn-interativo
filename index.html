<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Venn Interativo</title>

  <!-- D3 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h1>Venn Dashboard</h1>
    <p>Visualização interativa</p>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="header">
      <h2>Diagrama de Venn</h2>
    </div>

    <div class="grid">

      <!-- CONFIG -->
      <div class="card">
        <h3>Configuração</h3>

        <!-- LABELS -->
        <div class="input-group">
          <label>Label A</label>
          <input id="labelA" value="A">
        </div>

        <div class="input-group">
          <label>Label B</label>
          <input id="labelB" value="B">
        </div>

        <div class="input-group">
          <label>Label C</label>
          <input id="labelC" value="C">
        </div>

        <div class="input-group">
          <label>A ∩ B</label>
          <input id="labelAB" value="A∩B">
        </div>

        <div class="input-group">
          <label>A ∩ C</label>
          <input id="labelAC" value="A∩C">
        </div>

        <div class="input-group">
          <label>B ∩ C</label>
          <input id="labelBC" value="B∩C">
        </div>

        <div class="input-group">
          <label>A ∩ B ∩ C</label>
          <input id="labelABC" value="A∩B∩C">
        </div>

        <button onclick="render()">Atualizar</button>
      </div>

      <!-- GRÁFICO -->
      <div class="card">
        <h3>Visualização</h3>
        <div id="venn"></div>
        <div id="info">Clique em uma região</div>
      </div>

    </div>
  </div>
</div>

<!-- SCRIPT -->
<script src="script.js"></script>

<!-- render inicial -->
<script>
  render();
</script>

</body>
</html>
