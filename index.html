<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Venn Interativo</title>

  <!-- D3 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h1>Venn Dashboard</h1>
    <p>Visualização interativa</p>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <div class="header">
      <h2>Diagrama de Venn</h2>
      <button onclick="render()">Atualizar</button>
    </div>

    <!-- CONTROLES -->
    <div class="controls">

      <div class="group">
        <span>Conjuntos</span>
        <input id="labelA" value="A">
        <input id="labelB" value="B">
        <input id="labelC" value="C">
      </div>

      <div class="group">
        <span>Interseções</span>
        <input id="labelAB" value="A∩B">
        <input id="labelAC" value="A∩C">
        <input id="labelBC" value="B∩C">
        <input id="labelABC" value="A∩B∩C">
      </div>

    </div>

    <!-- GRÁFICO -->
    <div class="venn-wrapper">
      <div id="venn"></div>
      <div id="info">Clique em uma região</div>
    </div>

  </main>
</div>

<!-- JS -->
<script src="script.js"></script>

<!-- render inicial -->
<script>
  render();
</script>

</body>
</html>
